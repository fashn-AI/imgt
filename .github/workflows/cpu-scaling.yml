name: CPU scaling screen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix benchmark/engines
      - run: docker build -f benchmark/engines/Dockerfile -t imgt-engines:local .
      - run: node benchmark/engines/fixtures.mjs
      - name: Screen CPU and thread counts in forward and reverse order
        run: |
          mkdir -p benchmark/cpu-results
          for profile in 1-1 1-2 2-1 2-2 2-2 2-1 1-2 1-1; do
            run=$(( ${run:-0} + 1 ))
            ENGINE_CPUS=${profile%-*} ENGINE_VIPS_CONCURRENCY=${profile#*-} \
              ENGINE_REPORT=benchmark/cpu-results/$run-$profile.json \
              node benchmark/engines/run.mjs
          done
        env:
          ENGINE_PROFILE: sharp-late-icc
          ENGINE_SAMPLES: '3'
          ENGINE_FIXTURES: portrait-original.jpg,landscape-baseline.jpg,landscape-progressive.jpg
      - run: node benchmark/engines/summarize-scaling.mjs benchmark/cpu-results > benchmark/cpu-scaling-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-scaling-results
          path: |
            benchmark/cpu-results
            benchmark/cpu-scaling-summary.json
          retention-days: 7
