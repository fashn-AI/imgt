name: Owned service comparison
on:
  workflow_dispatch:
    inputs:
      imgt_endpoint:
        description: Your imgt deployment URL
        required: true
        type: string
      vercel_endpoint:
        description: Your enabled Vercel reference URL
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node benchmark/compare-services.mjs
        env:
          IMGT_ENDPOINT: ${{ inputs.imgt_endpoint }}
          VERCEL_ENDPOINT: ${{ inputs.vercel_endpoint }}
          SAMPLES: '10'
          SOURCE_PREWARM: '1'
          CLIENT_REGION: GitHub Actions (inspect response POP headers)
          SERVICE_OUTPUT: benchmark/services-owned-runner.json
          SERVICE_IMAGE_DIR: benchmark/service-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-service-comparison
          path: |
            benchmark/services-owned-runner.json
            benchmark/service-images
          retention-days: 7
