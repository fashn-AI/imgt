name: Owned service comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node benchmark/compare-services.mjs
        env:
          IMGT_ENDPOINT: https://imgt.relferreira.workers.dev
          VERCEL_ENDPOINT: https://imgt-vercel-reference.vercel.app
          SAMPLES: '10'
          SOURCE_PREWARM: '1'
          CLIENT_REGION: GitHub Actions (inspect response POP headers)
          SERVICE_OUTPUT: benchmark/services-owned-runner.json
          SERVICE_IMAGE_DIR: benchmark/service-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-service-comparison
          path: |
            benchmark/services-owned-runner.json
            benchmark/service-images
          retention-days: 7
