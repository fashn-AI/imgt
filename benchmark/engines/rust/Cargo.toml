[package]
name = "imgt-engine-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "=6.1.0", features = ["image"] }
webp = { version = "=0.3.1", default-features = false }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
